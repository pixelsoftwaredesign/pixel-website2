# Worker dédié à l'espace GestiActiv.
# Déploiement : cd cloudflare && npx wrangler deploy -c gestiactiv.wrangler.toml
#
# Expose gestiactiv.pixelsoftwaredesign.xyz en proxy vers le backend Render
# en réécrivant le Host et en posant l'en-tête X-GestiActiv (SSO Django).
name = "gestiactiv"
main = "gestiactiv-worker.js"
compatibility_date = "2026-01-01"

[[routes]]
pattern = "gestiactiv.pixelsoftwaredesign.xyz"
custom_domain = true
