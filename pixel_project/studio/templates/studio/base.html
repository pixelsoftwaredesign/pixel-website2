{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pixel Software Design{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{font-family:'Space Grotesk',system-ui,sans-serif;background:#0a0a1a;color:#e0e0e0;min-height:100vh}
  a{color:#7dd3fc}
  .text-muted{color:#94a3b8 !important}
  .table-dark{--bs-table-bg:#111827;--bs-table-color:#e5e7eb}
  .card{border-radius:14px}
</style>
{% block extrahead %}{% endblock %}
</head>
<body>
{% block body %}
{% block content %}{% endblock %}
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extrajs %}{% endblock %}
</body>
</html>
