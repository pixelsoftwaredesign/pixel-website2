<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Audio — PixelSoftware Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']},colors:{pixel:{bg:'#070a11',panel:'#0d1322',border:'#1b2438',cyan:'#38bdf8'}}}}</script>
<style>body{background-color:#070a11}pre{white-space:pre-wrap;word-wrap:break-word}</style>
</head>
<body class="text-slate-200 font-sans min-h-screen bg-pixel-bg">
<header class="sticky top-0 z-50 bg-pixel-panel/90 backdrop-blur-md border-b border-pixel-border px-4 lg:px-6 py-2.5">
  <div class="max-w-5xl mx-auto flex items-center justify-between">
    <a href="/academy/" class="flex items-center gap-3"><span class="font-mono font-bold text-white">PIXELSOFTWARE</span><span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-pixel-cyan/10 border border-pixel-cyan/30 text-pixel-cyan">ACADEMY</span></a>
    <a href="/" class="font-mono text-xs text-slate-400 hover:text-pixel-cyan">Pixel Software Design</a>
    <a href="/academy/" class="font-mono text-xs text-slate-400 hover:text-pixel-cyan"><i class="fa-solid fa-arrow-left mr-1"></i> Retour</a>
  </div>
</header>
<main class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
  <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">IA Audio</h1>
  <p class="text-slate-400 text-sm mb-6">Pixel Software Design · Édition 2026</p>
  <div class="bg-pixel-panel border border-pixel-border rounded-2xl p-6">
    <pre class="font-mono text-xs text-slate-300 leading-relaxed">{{ text }}</pre>
  </div>
  <div class="mt-6 text-center text-slate-500 text-xs font-mono">© 2026 Pixel Software Design — Tous droits réservés.</div>
</main>
</body>
</html>
