{% extends "studio/pixsoftpay_base.html" %}
{% block content %}
<style>
.receive-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#00c853,#1EB482);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px}
.receive-link-box{background:#0a0a1a;border:1px solid #1e1e3a;border-radius:10px;padding:16px;text-align:center;margin-top:16px;word-break:break-all}
.receive-link-box a{color:#6c63ff;font-size:.85rem}
.receive-link-box .big-amount{font-size:2.5rem;font-weight:700;color:#6c63ff;margin:16px 0 8px}
.qr-section{text-align:center;margin-top:24px}
.qr-section canvas,.qr-section img{border-radius:12px}
</style>

<div class="pp-card" style="text-align:center">
  <div class="receive-icon">💰</div>
  <h2 style="margin-bottom:4px">Recevoir de l'argent</h2>
  <p style="color:#888;font-size:.85rem;margin-bottom:6px">Partagez votre lien ou QR code pour recevoir un paiement</p>

  <div style="background:rgba(0,200,83,.08);border:1px solid rgba(0,200,83,.2);border-radius:10px;padding:12px;margin:16px 0;text-align:left">
    <p style="color:#888;font-size:.8rem;margin:0">Votre solde actuel</p>
    <p style="font-size:1.4rem;font-weight:700;color:#00c853;margin:4px 0 0">{{ wallet.solde }} TND</p>
  </div>

  <div class="pp-form-group" style="text-align:left">
    <label for="receiveAmount">Montant à recevoir (TND)</label>
    <input type="number" id="receiveAmount" placeholder="0.00" min="0.01" step="0.01" style="width:100%;padding:10px 14px;background:#0a0a1a;border:1px solid #1e1e3a;border-radius:8px;color:#fff;font-size:.9rem">
  </div>
  <div class="pp-form-group" style="text-align:left;margin-top:14px">
    <label for="receiveDesc">Description (optionnel)</label>
    <input type="text" id="receiveDesc" placeholder="Motif du paiement" style="width:100%;padding:10px 14px;background:#0a0a1a;border:1px solid #1e1e3a;border-radius:8px;color:#fff;font-size:.9rem">
  </div>

  <button class="pp-btn pp-btn-success" style="width:100%;margin-top:16px;font-size:1rem;padding:14px" onclick="generateReceive()">Générer le lien →</button>

  <div id="receiveResult" style="display:none">
    <div class="receive-link-box">
      <p style="color:#888;font-size:.8rem;margin-bottom:4px">Lien de paiement</p>
      <div class="big-amount" id="rxAmount">0 TND</div>
      <a id="rxLink" href="#" target="_blank"></a>
      <div style="margin-top:16px">
        <button class="pp-btn pp-btn-outline" onclick="copyLink()" style="margin-right:8px">📋 Copier le lien</button>
        <button class="pp-btn pp-btn-outline" onclick="shareLink()">📤 Partager</button>
      </div>
    </div>
    <div class="qr-section">
      <p style="color:#888;font-size:.85rem;margin-bottom:12px">QR Code</p>
      <div id="qrOutput" style="display:inline-block;background:#fff;padding:12px;border-radius:12px"></div>
    </div>
    <p id="copyStatus" style="font-size:.8rem;margin-top:8px"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
var currentPayUrl = '';
function generateReceive(){
  var amount = parseFloat(document.getElementById('receiveAmount').value);
  var desc = document.getElementById('receiveDesc').value.trim();
  var result = document.getElementById('receiveResult');
  if(!amount || amount<=0){return;}
  fetch('/api/pixsoftpay/receive/',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':'{{ csrf_token }}'},
    body:JSON.stringify({amount:amount,description:desc})
  }).then(function(r){return r.json()}).then(function(d){
    if(d.status==='success'){
      currentPayUrl = window.location.origin + d.payment_url;
      document.getElementById('rxAmount').textContent = amount+' TND';
      document.getElementById('rxLink').href = currentPayUrl;
      document.getElementById('rxLink').textContent = currentPayUrl;
      result.style.display='block';
      var qrDiv = document.getElementById('qrOutput');
      qrDiv.innerHTML='';
      QRCode.toCanvas(document.createElement('canvas'), currentPayUrl, {width:200,margin:2}, function(err,canvas){
        if(!err){qrDiv.appendChild(canvas);}
      });
    }else{
      result.style.display='none';
      alert(d.error||'Erreur');
    }
  });
}
function copyLink(){
  navigator.clipboard.writeText(currentPayUrl).then(function(){
    document.getElementById('copyStatus').textContent='✅ Lien copié !';
    document.getElementById('copyStatus').style.color='#00c853';
  });
}
function shareLink(){
  if(navigator.share){
    navigator.share({title:'Paiement PixSoftPay',url:currentPayUrl});
  }else{
    copyLink();
  }
}
</script>
{% endblock %}
